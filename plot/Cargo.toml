[package]
name = "vqhull"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "bandwidth"
path = "src/bandwidth.rs"

[[bin]]
name = "energy"
path = "src/energy.rs"

[[bin]]
name = "speedup"
path = "src/speedup.rs"

[[bin]]
name = "tables"
path = "src/tables.rs"

[dependencies]
csv = "1.4.0"
epy = { git = "https://github.com/JordyAaldering/epy.git" }
serde = { version = "1.0.228", features = ["derive"] }
